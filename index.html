<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f766e">
<title>终端数据填报</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E7%BB%88%3C/text%3E%3C/svg%3E">

<style>
  :root{
    --brand:#0f766e;
    --brand-2:#0b5c56;
    --brand-soft:#e6f4f1;
    --bg:#f2f4f6;
    --card:#ffffff;
    --line:#e4e8ee;
    --ink:#14202e;
    --muted:#6b7686;
    --muted-2:#98a2b3;
    --warn:#b45309;
    --warn-soft:#fdf4e3;
    --danger:#b42318;
    --danger-soft:#fdeceb;
    --ok:#0f766e;
    --ok-soft:#e6f4f1;
    --amber:#d97706;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:640px;margin:0 auto;padding:0 14px 96px;}
  .shell.wide{max-width:820px;}
  a{color:var(--brand);text-decoration:none;}
  button{font-family:inherit;font-size:inherit;cursor:pointer;}

  /* ---------- topbar ---------- */
  .topbar{max-width:640px;margin:0 auto;padding:14px 14px 0;display:flex;align-items:center;gap:10px;}
  .topbar .back{border:0;background:#fff;border-radius:10px;padding:7px 11px;box-shadow:var(--shadow);color:var(--ink);font-size:14px;}
  .topbar .ttl{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- hero ---------- */
  .hero{
    background:linear-gradient(135deg,#0f766e 0%,#0b5c56 55%,#134e4a 100%);
    color:#fff;border-radius:18px;padding:18px 18px 16px;margin:14px 0 14px;
    box-shadow:0 8px 24px rgba(15,118,110,.18);
  }
  .hero .k{font-size:12px;letter-spacing:.14em;opacity:.75;text-transform:uppercase;}
  .hero h1{margin:6px 0 2px;font-size:21px;font-weight:650;letter-spacing:.01em;}
  .hero .sub{font-size:13px;opacity:.82;}
  .hero .prog{margin-top:14px;height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;}
  .hero .prog > i{display:block;height:100%;background:#7fe0cf;border-radius:99px;transition:width .4s ease;}
  .hero .prog-txt{display:flex;justify-content:space-between;font-size:12px;margin-top:7px;opacity:.9;font-variant-numeric:tabular-nums;}

  /* ---------- cards ---------- */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
  .card.tight{padding:13px 14px;}
  .sec-title{font-size:13px;font-weight:650;color:var(--muted);letter-spacing:.05em;margin:18px 2px 8px;}
  .sec-title:first-child{margin-top:4px;}

  /* ---------- filters ---------- */
  .search{position:relative;margin:0 0 10px;}
  .search input{
    width:100%;padding:11px 12px 11px 36px;border:1px solid var(--line);border-radius:12px;
    background:#fff;font-size:15px;color:var(--ink);outline:none;
  }
  .search input:focus{border-color:#9fd3ca;box-shadow:0 0 0 3px rgba(15,118,110,.10);}
  .search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:14px;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:6px 12px;border-radius:99px;font-size:13px;white-space:nowrap;
  }
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .chip .n{opacity:.65;font-size:12px;margin-left:4px;}
  .toggles{display:flex;gap:8px;margin:0 0 10px;}
  .tg{
    border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:6px 11px;border-radius:9px;font-size:12.5px;
  }
  .tg.on{background:var(--brand-soft);border-color:#b9e0d8;color:var(--brand);font-weight:600;}

  /* ---------- terminal list ---------- */
  .list{display:flex;flex-direction:column;gap:8px;}
  .row{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;
    padding:12px 14px;box-shadow:var(--shadow);border:1px solid transparent;
  }
  .row:active{background:#f8fafb;}
  .row.done{border-color:#cfe9e4;background:linear-gradient(0deg,#f7fdfc,#fff);}
  .row .main{flex:1;min-width:0;}
  .row .nm{font-size:15px;font-weight:600;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .mt{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .rt{text-align:right;flex:0 0 auto;}
  .badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;background:#f0f2f5;color:var(--muted);border:1px solid var(--line);}
  .badge.done{background:var(--ok-soft);color:var(--ok);border-color:#bfe3dc;}
  .badge.warn{background:var(--warn-soft);color:var(--warn);border-color:#f2ddb8;}
  .row .num{font-size:12px;color:var(--muted-2);margin-top:4px;font-variant-numeric:tabular-nums;}
  .more{width:100%;border:1px dashed #cfd6e0;background:transparent;color:var(--muted);padding:11px;border-radius:12px;font-size:13px;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 0;}

  /* ---------- form ---------- */
  .field{margin:0 0 14px;}
  .field:last-child{margin-bottom:0;}
  .field > label{display:block;font-size:13px;color:#3d4a5c;font-weight:600;margin-bottom:6px;}
  .field .hint{font-size:12px;color:var(--muted-2);margin-top:5px;line-height:1.45;}
  .input{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;
    font-size:16px;color:var(--ink);outline:none;font-variant-numeric:tabular-nums;
  }
  .input:focus{border-color:#9fd3ca;box-shadow:0 0 0 3px rgba(15,118,110,.10);}
  .input.err{border-color:#f0b4ae;background:#fffafa;}
  .input:disabled{background:#f6f7f9;color:#a6aebb;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .readonly{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px;}
  .readonly .k{color:var(--muted-2);}
  .readonly .v{color:var(--ink);font-weight:600;}
  .tagline{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .tag{font-size:11.5px;padding:3px 8px;border-radius:6px;background:#f0f2f5;color:#4b5768;border:1px solid #e6eaf0;}

  .ratio{
    margin-top:8px;background:#f7f9fb;border:1px solid #e9edf3;border-radius:10px;
    padding:9px 12px;font-size:12.5px;color:#43516a;display:flex;justify-content:space-between;gap:10px;
    font-variant-numeric:tabular-nums;
  }
  .ratio b{color:var(--brand);font-weight:650;}
  .ratio.bad{background:var(--danger-soft);border-color:#f7cfcb;color:var(--danger);}
  .ratio.bad b{color:var(--danger);}

  /* treated types */
  .trow{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed #eef1f5;}
  .trow:last-child{border-bottom:0;}
  .cb{display:flex;align-items:center;gap:9px;font-size:14px;color:#2b3648;cursor:pointer;}
  .cb input{width:18px;height:18px;accent-color:var(--brand);margin:0;}
  .cb .num-in{width:100%;padding:8px 10px;font-size:15px;text-align:right;}

  /* yes / no */
  .titem{padding:11px 0;border-bottom:1px dashed #eef1f5;}
  .titem:last-child{border-bottom:0;}
  .titem .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .titem .nm{font-size:14px;font-weight:600;}
  .yn{display:inline-flex;background:#f1f3f6;border-radius:9px;padding:3px;gap:2px;}
  .yn button{border:0;background:transparent;padding:5px 13px;border-radius:7px;font-size:13px;color:var(--muted);}
  .yn button.on[data-v="1"]{background:var(--brand);color:#fff;box-shadow:0 1px 3px rgba(15,118,110,.3);}
  .yn button.on[data-v="0"]{background:#fff;color:#1f2937;font-weight:650;box-shadow:0 1px 3px rgba(16,24,40,.16);}
  .titem .ratio-line{display:flex;align-items:center;gap:8px;margin-top:9px;}
  .titem .ratio-line label{font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .titem .ratio-line input{width:96px;padding:7px 9px;font-size:14px;text-align:right;margin-left:auto;}

  /* action bar */
  .actionbar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:10px;max-width:640px;margin:0 auto;
  }
  .btn{border:0;border-radius:11px;padding:12px 16px;font-size:15px;font-weight:600;}
  .btn.primary{background:var(--brand);color:#fff;flex:1;box-shadow:0 4px 12px rgba(15,118,110,.22);}
  .btn.primary:active{background:var(--brand-2);}
  .btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line);}
  .btn.small{padding:8px 12px;font-size:13px;font-weight:500;}

  /* tabbar */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:29;
    background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);display:flex;
    padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    flex:1;border:0;background:transparent;color:var(--muted-2);
    font-size:11.5px;padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .tabbar button .ic{font-size:17px;line-height:1;}
  .tabbar button.on{color:var(--brand);font-weight:600;}
  body.form-open .tabbar{display:none;}

  /* report */
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
  .kpi{background:#fff;border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);}
  .kpi .l{font-size:11.5px;color:var(--muted-2);}
  .kpi .v{font-size:22px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .kpi .v small{font-size:12px;font-weight:500;color:var(--muted-2);margin-left:3px;}
  .kpi .d{font-size:11px;color:var(--muted-2);margin-top:2px;}
  .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}
  .stat3 .sv{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink);}
  .stat3 .sl{font-size:10.5px;color:var(--muted-2);margin-top:2px;line-height:1.4;}
  .mini-t{font-size:12px;font-weight:650;color:var(--muted);margin:0 0 6px;}

  .bars{display:flex;flex-direction:column;gap:9px;}
  .bar-row{display:grid;grid-template-columns:104px 1fr 62px;gap:9px;align-items:center;font-size:12.5px;}
  .bar-row .lb{color:#3b4759;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-row .tr{height:9px;background:#eef1f5;border-radius:99px;overflow:hidden;}
  .bar-row .tr > i{display:block;height:100%;border-radius:99px;background:var(--brand);}
  .bar-row .vv{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;}

  .concl{border-radius:12px;padding:12px 14px;margin-bottom:9px;border:1px solid;display:flex;gap:10px;align-items:flex-start;}
  .concl .dot{flex:0 0 auto;width:7px;height:7px;border-radius:99px;margin-top:8px;}
  .concl.warn{background:var(--warn-soft);border-color:#f3e0bd;}
  .concl.warn .dot{background:var(--warn);}
  .concl.bad{background:var(--danger-soft);border-color:#f6d2ce;}
  .concl.bad .dot{background:var(--danger);}
  .concl.ok{background:var(--ok-soft);border-color:#c6e6e0;}
  .concl.ok .dot{background:var(--ok);}
  .concl.info{background:#f4f7fc;border-color:#dde6f2;}
  .concl.info .dot{background:#5b7ea8;}
  .concl .tt{font-size:13.5px;font-weight:650;margin-bottom:2px;}
  .concl .tx{font-size:12.5px;color:#4a5567;line-height:1.55;}

  table.tb{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.tb th,table.tb td{padding:8px 6px;border-bottom:1px solid #eef1f5;text-align:right;font-variant-numeric:tabular-nums;}
  table.tb th{color:var(--muted-2);font-weight:600;font-size:11.5px;}
  table.tb th:first-child,table.tb td:first-child{text-align:left;}
  table.tb tbody tr:last-child td{border-bottom:0;}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* settings */
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #f1f3f6;}
  .set-row > div:first-child{min-width:0;}
  .set-row:last-child{border-bottom:0;}
  .set-row .lb{font-size:14px;}
  .set-row .sb{font-size:12px;color:var(--muted-2);margin-top:2px;}
  .seg{display:inline-flex;background:#f1f3f6;border-radius:10px;padding:3px;gap:2px;}
  .seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-size:13px;color:var(--muted);white-space:nowrap;}
  .seg button.on{background:#fff;color:var(--brand);font-weight:650;box-shadow:0 1px 3px rgba(16,24,40,.10);}
  textarea.input{min-height:132px;resize:vertical;font-size:13.5px;line-height:1.7;}

  /* toast */
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);z-index:90;
    background:rgba(20,32,46,.94);color:#fff;padding:11px 17px;border-radius:11px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:82vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.err{background:rgba(160,32,24,.96);}

  .note{font-size:12px;color:var(--muted);line-height:1.6;background:#f8fafb;border:1px dashed #e2e7ee;border-radius:10px;padding:11px 12px;}
  .pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--brand-soft);color:var(--brand);font-weight:600;}
  .divider{height:1px;background:#f1f3f6;margin:14px 0;}
  .mono{font-variant-numeric:tabular-nums;}
  @media (min-width:700px){
    .shell,.topbar,.actionbar{max-width:700px;}
  }
</style>
</head>
<body>
<div id="top"></div>
<div id="view"></div>
<nav id="tabbar" class="tabbar"></nav>
<div id="toast"></div>
<script src="terminals.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
